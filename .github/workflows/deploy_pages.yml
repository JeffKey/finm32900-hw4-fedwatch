name: Build and Deploy FedWatch Site

# Rebuilds the whole pipeline (Databento + FRED pulls, notebooks, forecast
# chart, chartbook site, tests) and publishes the built site to GitHub Pages.
# This is the "daily monitor": the cron below refreshes the next-FOMC-meeting
# forecast every morning.
#
# Cron syntax reference:
# ┌───────────── minute (0-59)
# │ ┌───────────── hour (0-23, UTC — GitHub Actions cron always runs in UTC)
# │ │ ┌───────────── day of month (1-31)
# │ │ │ ┌───────────── month (1-12)
# │ │ │ │ ┌───────────── day of week (0-6, Sunday=0)
# │ │ │ │ │
# 30 14 * * *  -> every day at 14:30 UTC (8:30-9:30 AM Chicago), after the
#                 New York Fed's ~9:00 AM ET EFFR print year-round
on:
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch: {}  # manual "Run workflow" button / `gh workflow run`
  push:
    branches: [main]

# GITHUB_TOKEN needs write access to force-push the gh-pages branch.
permissions:
  contents: write

# Never let two deploys interleave their force-pushes (e.g., the daily cron
# racing a push to main). The newest run supersedes an in-flight one.
concurrency:
  group: deploy-fedwatch-site
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # This workflow is meant for the separate PUBLIC repo under your own
    # account (Task 2 in the README). It must never run inside the course
    # orgs' classroom repos, which have no DATABENTO_API_KEY secret.
    if: github.repository_owner != 'finm-32900' && github.repository_owner != 'hw-finm-32900'
    env:
      TZ: "America/Chicago"

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build (pull data, run notebooks, charts, site, tests)
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: doit

      - name: Assemble site tree
        run: |
          SITE="$RUNNER_TEMP/site"          # staged OUTSIDE the repo checkout
          mkdir -p "$SITE"
          cp -r docs/. "$SITE/"
          # Tell GitHub Pages not to run Jekyll (it would drop _static/ etc.)
          touch "$SITE/.nojekyll"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy to gh-pages (single orphan commit, force-pushed)
        run: |
          # Orphan branch = no parent commits, so gh-pages always contains
          # exactly ONE commit no matter how many times this workflow runs.
          git checkout --orphan gh-pages
          git rm -rf --quiet .
          # git rm only removes *tracked* files; also purge untracked and
          # gitignored build leftovers (_data/, _output/, docs/) so nothing
          # from the build sneaks into the published site.
          git clean -fdx --quiet
          cp -r "$RUNNER_TEMP/site/." .
          git add -A
          git commit -m "Deploy FedWatch site $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          git push --force origin gh-pages
